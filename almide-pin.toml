# Pin the Almide compiler release to evaluate against.
# Update manually when cutting a new MSR baseline.
# Pinning ensures day-to-day MSR numbers are comparable — compiler changes
# only affect results when you deliberately bump this.
#
# The Daily MSR Run workflow reads `ref` and installs exactly that release
# (tools/install.sh <ref>), refuses to run if `almide --version` disagrees,
# and the harness stamps `almide --version` into every summary.md. This file
# is the ONLY place the workflow's compiler version lives.

[compiler]
repo = "github.com/almide/almide"
ref = "v0.65.0"  # 2026-09-28: latest final release; carries the Linux forward-ref type fix (#2721) that blocked the v0.64.0 pin, ADR-0021 (a lambda's failure channel from context) and ADR-0022 (output and abort builtins in a pure fn)
